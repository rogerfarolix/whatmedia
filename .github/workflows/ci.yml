name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # ffmpeg lets the fallback API end-to-end tests run instead of being skipped
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Playwright is a dependency of @whatmedia/app, not of the workspace root
      - run: pnpm --filter @whatmedia/app exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
