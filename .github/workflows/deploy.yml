# Deploys main to the Nealix VPS after a green CI run, the same way it is done by hand
# (docs/06-DEPLOIEMENT.md, mode B'): git pull + docker compose build on the server.
#
# Disabled until configured. To enable:
#   - repository variable DEPLOY_ENABLED=true
#   - secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key whose public key is in
#     ~deploy/.ssh/authorized_keys on the server), DEPLOY_PATH (/var/www/Projets/nealix/whatmedia)
name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: { group: deploy-prod, cancel-in-progress: false }

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git checkout --quiet main
            git pull --ff-only --quiet origin main
            docker tag whatmedia-web whatmedia-web:rollback || true
            docker tag whatmedia-api whatmedia-api:rollback || true
            docker compose -f deploy/docker-compose.server.yml up -d --build
            docker image prune -f
      - name: Smoke test
        run: |
          sleep 15
          curl -fsS https://whatmedia.nealix.org/ > /dev/null
          curl -fsS https://whatmedia.nealix.org/app/ > /dev/null
          curl -fsS https://whatmedia.nealix.org/api/v1/health
