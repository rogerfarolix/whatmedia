name: Monthly Quality Benchmark

on:
  schedule:
    # Runs on the 1st of every month at 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg with libvmaf
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libvmaf-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Run Quality Measurements
        run: node tools/quality/measure.mjs

      - name: Create Pull Request with updated measurements if drifted
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(benchmarks): update monthly VMAF/SSIM measurements'
          title: 'Monthly VMAF/SSIM Benchmark Calibration'
          body: 'Automated monthly run of ITU-R BT.500 / Netflix libvmaf and SSIM quality benchmarks against WhatsApp compression profiles.'
          branch: 'benchmarks/monthly-calibration'
          delete-branch: true

