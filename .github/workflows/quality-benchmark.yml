name: Monthly encoder self-check (simulation)

on:
  schedule:
    # Runs on the 1st of every month at 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg with libvmaf
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libvmaf-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Run Quality Measurements
        run: node tools/quality/measure.mjs

      # Simulated numbers are NOT published on the site (CLAUDE.md: never invent quality numbers).
      # Real measurements need files sent through WhatsApp, see docs/08-TESTS-QUALITE.md §3.
      - uses: actions/upload-artifact@v4
        with:
          name: encoder-simulation
          path: tools/quality/out/simulation.json
