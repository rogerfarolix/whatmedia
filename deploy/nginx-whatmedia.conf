# Mode B — à placer dans /etc/nginx/sites-available/whatmedia.nealix.org
# puis : ln -s ../sites-available/whatmedia.nealix.org /etc/nginx/sites-enabled/
#        certbot --nginx -d whatmedia.nealix.org
#        nginx -t && systemctl reload nginx
# Ne modifie AUCUN autre fichier de site existant.

server {
    listen 80;
    listen [::]:80;
    server_name whatmedia.nealix.org;

    client_max_body_size 1g;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
    }

    location = /app/sw.js {
        proxy_pass http://127.0.0.1:8081;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
    # certbot ajoutera le bloc 443 et la redirection HTTP → HTTPS
}
