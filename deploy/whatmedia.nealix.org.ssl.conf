# WhatMedia Nginx Host Configuration with SSL and API proxy
server {
    server_name whatmedia.nealix.org;

    access_log /var/log/nginx/whatmedia.nealix.org.access.log;
    error_log  /var/log/nginx/whatmedia.nealix.org.error.log;

    client_max_body_size 1024m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8097/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8097/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/whatmedia.nealix.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/whatmedia.nealix.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = whatmedia.nealix.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name whatmedia.nealix.org;
    return 404; # managed by Certbot
}

