# WhatMedia — production
# Mode A (pas de reverse proxy sur le serveur) : docker compose --profile edge [--profile api] up -d
# Mode B (Nginx existant)                    : docker compose [--profile api] up -d   + deploy/nginx-whatmedia.conf
name: whatmedia

services:
  web:
    image: ghcr.io/${GH_OWNER}/whatmedia-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /config, /data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:8081:8080"   # utilisé en mode B uniquement
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    profiles: [api]
    image: ghcr.io/${GH_OWNER}/whatmedia-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - jobs:/data/jobs
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    user: "10001:10001"
    deploy:
      resources:
        limits: { cpus: "${API_CPUS:-2}", memory: "${API_MEMORY:-2g}" }
    ports:
      - "127.0.0.1:8082:3000"   # utilisé en mode B uniquement
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    profiles: [edge]
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
    depends_on: [web]

volumes:
  jobs:
  caddy_data:
  caddy_config:
