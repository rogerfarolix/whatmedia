# WhatMedia Nginx Host Configuration (Reverse Proxy to Docker container)
# Placement: /etc/nginx/sites-available/whatmedia.nealix.org
# Activation:
#   sudo ln -s /etc/nginx/sites-available/whatmedia.nealix.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d whatmedia.nealix.org

server {
    listen 80;
    listen [::]:80;
    server_name whatmedia.nealix.org;

    access_log /var/log/nginx/whatmedia.nealix.org.access.log;
    error_log  /var/log/nginx/whatmedia.nealix.org.error.log;

    client_max_body_size 1024m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8097/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8097/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
    }
}
